[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and adds @netlify/plugin-nextjs automatically.

# Old WordPress URLs → new pages. /terms-of-services and /privacy-policy keep
# their old URLs, so they need no redirect.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301

# Routes removed in the 2026 content rebuild → their new homes.
[[redirects]]
  from = "/industries"
  to = "/who-we-serve"
  status = 301

[[redirects]]
  from = "/case-studies"
  to = "/our-work"
  status = 301

[[redirects]]
  from = "/case-studies/*"
  to = "/our-work"
  status = 301

[[redirects]]
  from = "/services/software-web-development"
  to = "/services#ai-powered-engineering"
  status = 301

[[redirects]]
  from = "/services/creative-design"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/digital-marketing"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/it-consulting"
  to = "/services#digital-innovation"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
